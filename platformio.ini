[platformio]
data_dir = data

[env:lolin_s2_mini]
platform = espressif32@6.5.0
framework = arduino
board = lolin_s2_mini
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs

build_flags =
    -D MQTT_MAX_PACKET_SIZE=2048
    -D CORE_DEBUG_LEVEL=4
    -D _DEBUG
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

upload_flags =
    --after
    no_reset
   

; Менеджер зависимостей в точном синтаксисе без использования сырых ссылок github
lib_deps =
    gyverlibs/GyverDB @ 1.4.3
    gyverlibs/Settings @ 1.3.16
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5
    adafruit/Adafruit SSD1306 @ ^2.5.13

;tree /f /a | out-file project_summary.txt -enc utf8; gc src\* -enc utf8 | out-file project_summary.txt -app -enc utf8
;!!!!//  Get-ChildItem . -Recurse | Where-Object { $_.FullName -notmatch '\\\.' } | ForEach-Object { if ($_.PsIsContainer) { "+---" + $_.Name } else { "|   " + $_.Name } } | Out-File project_summary.txt -Encoding utf8; Get-ChildItem src -Recurse -File | Where-Object { $_.DirectoryName -notmatch '\\\.' } | ForEach-Object { "`n=== Файл: $($_.Name) ==="; Get-Content $_.FullName -Encoding utf8 } | Out-File project_summary.txt -Append -Encoding utf8

