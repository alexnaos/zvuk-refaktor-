[platformio]
data_dir = data

[env:lolin_s2_mini]
platform = espressif32@6.5.0
framework = arduino
board = lolin_s2_mini
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs
monitor_dtr = 0
monitor_rts = 0
monitor_filters = send_on_enter
upload_port = COM5

upload_flags =
    --before
    no_reset
    --after
    no_reset

build_flags =
    -D MQTT_MAX_PACKET_SIZE=2048
    -D CORE_DEBUG_LEVEL=4
    -D _DEBUG
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

; Менеджер зависимостей в точном синтаксисе без использования сырых ссылок github
lib_deps =
    gyverlibs/GyverDB @ 1.4.3
    gyverlibs/Settings @ 1.3.16
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5
    adafruit/Adafruit SSD1306 @ ^2.5.13

; === OTA ===
[env:lolin_s2_mini_ota]
platform = espressif32@6.5.0
framework = arduino
board = lolin_s2_mini
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs
monitor_dtr = 0
monitor_rts = 0
monitor_filters = send_on_enter
build_flags =
    -D MQTT_MAX_PACKET_SIZE=2048
    -D CORE_DEBUG_LEVEL=4
    -D _DEBUG
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
lib_deps =
    gyverlibs/GyverDB @ 1.4.3
    gyverlibs/Settings @ 1.3.16
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5
    adafruit/Adafruit SSD1306 @ ^2.5.13
upload_protocol = espota
upload_port = 192.168.1.76
; pio run -e lolin_s2_mini_ota --target upload